# OBCX Bridge Plugin Configuration
[global]
locale = "zh_CN.UTF8"
#locale = "en_US.UTF8"

# Bot configurations - both QQ and Telegram bots are needed for bridge
[bots.qq_bot]
type = "qq"
enabled = true
plugins = ["qq_to_tg"]

[bots.qq_bot.connection]
type = "websocket"
host = "127.0.0.1"
port = 3001
access_token = ""         # leave empty if no access token for llonebot
secret = ""
use_ssl = false
connect_timeout = 5000      # TCP connect timeout (ms)
action_timeout = 30000      # OneBot action echo timeout; must exceed upstream
                            # latency (llonebot can take ~8s on first media send),
                            # otherwise retry queue fires -> duplicate delivery
heartbeat_interval = 5000

[bots.telegram_bot]
type = "telegram"
enabled = true
plugins = ["tg_to_qq"]

[bots.telegram_bot.connection]
type = "http"
host = "api.telegram.org"
port = 443
access_token = "2222"
use_ssl = true
connect_timeout = 5000      # HTTP request timeout (ms)
poll_timeout = 25000        # Telegram long-poll server-side timeout (ms)
poll_force_close = 30000    # Client-side force-close; must be > poll_timeout
poll_retry_interval = 3000  # Backoff between polling retries

# Proxy configuration for Telegram (optional)
proxy_host = "127.0.0.1"
proxy_port = 10086
proxy_type = "http"

# QQ to Telegram Plugin configuration
[plugins.qq_to_tg]
enabled = true
callbacks = ["on_message", "on_notice"]
priority = 100  # Higher priority (0-255, default: 0)
# required = []  # No dependencies (optional field)

[plugins.qq_to_tg.config]
database_file = "bridge_bot.db"
enable_retry_queue = true

# Telegram to QQ Plugin configuration
[plugins.tg_to_qq]
enabled = true
callbacks = ["on_message", "on_notice"]
priority = 100  # Same priority as qq_to_tg
# required = []  # No dependencies (optional field)

[plugins.tg_to_qq.config]
database_file = "bridge_bot.db"
enable_retry_queue = true
# GIF conversion settings (all optional, shown with defaults)
# ffmpeg_path = "ffmpeg"      # ffmpeg executable path
# In minimal containers without a suitable PATH, use "/usr/local/bin/ffmpeg".
# gif_max_file_size = 0        # Max output size in bytes (0 = unlimited)
# gif_max_duration = 5         # Max animation duration in seconds
# gif_max_fps = 0              # Max frame rate (0 = unlimited)
# gif_max_width = 0            # Max width in pixels (0 = original)
# gif_max_colors = 256         # Max palette colors (2-256)

[group_mappings]

[[group_mappings.group_to_group]]
telegram_group_id = "113"
qq_group_id = "112"
mode = "group_to_group"
show_qq_to_tg_sender = true
show_tg_to_qq_sender = false

[[group_mappings.group_to_group]]
telegram_group_id = "DDD"
qq_group_id = "22222"
mode = "group_to_group"
show_qq_to_tg_sender = true
show_tg_to_qq_sender = false

[[group_mappings.group_to_group]]
telegram_group_id = "CCC"
qq_group_id = "113413"
mode = "group_to_group"
show_qq_to_tg_sender = true
show_tg_to_qq_sender = true

[[group_mappings.topic_to_group]]
telegram_group_id = "AAA"
mode = "topic_to_group"
show_qq_to_tg_sender = true
show_tg_to_qq_sender = true

# Topics for the above Telegram group
[[group_mappings.topics]]
telegram_group_id = "AA"    # 明确指定属于哪个群
telegram_topic_id = 1
qq_group_id = "140320158"
